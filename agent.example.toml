# OverAnalyzer companion config. Copy to `agent.toml` and edit, then run:
#   python -m overanalyzer_agent --config agent.toml
# Env vars override the file: OA_AGENT_API_URL, OA_AGENT_WEB_URL, OA_AGENT_TOKEN.

# Hosted service defaults. The app does not expose these fields. Self-hosters can
# override them here or with OA_AGENT_API_URL / OA_AGENT_WEB_URL.
# api_url = "https://api.overanalyzer.app"
# web_url = "https://overanalyzer.app"
# api_url = "http://localhost:8000"
# web_url = "http://localhost:3000"

# Mint one device key from Settings > Devices in the web app. You would normally
# paste it into the app's Settings screen instead of editing this file.
bearer_token = ""
timeout_sec = 30.0

# Which display to capture in a multi-monitor setup. Unset means primary.
# The Settings > Advanced monitor menu lists the detected 1-based indexes.
# monitor_index = 2

# Capture is explicit and two-step. F11 holds the whole Summary Game Report frame
# in memory. F12 checks and uploads the whole Teams frame with it. The service crops
# both frames, retains only the board context artifacts, and discards the full frames.
# Capture never runs continuously and the debug folder stores metadata only.
hotkey_summary = "f11"
hotkey_scoreboard = "f12"

# In the app and tray this key pauses or resumes capture. The Discard control clears
# a held Summary frame. The headless CLI still uses it to reset the buffer.
hotkey_reset = "f9"
