name: Build Windows companion release candidate

on:
  workflow_dispatch:
  push:
    tags: ["agent-v*"]

# The released EXE is deliberately unsigned under the beta release policy. That makes
# this workflow the only integrity guarantee on the artifact a stranger downloads,
# so it is hardened accordingly:
#   * every action is pinned to a commit SHA, not a mutable tag - a compromised or
#     retagged action would otherwise be able to tamper with the build;
#   * no secrets and no OIDC token are available to the job at all;
#   * the SHA-256 sidecar is produced from the exact bytes that get uploaded.
#
# This source workflow lives in the private repository with prefixed companion
# paths. The exporter includes a root-level public copy and asserts its paths.
# Public repository creation, tagging, draft review,
# publication, and the web build URL remain owner-controlled steps.
# GitHub permissions are job-scoped, so only the publish job below has write access.
permissions: {}

concurrency:
  group: release-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Windows x64 artifact
    runs-on: windows-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      artifact-name: OverAnalyzer-${{ steps.version.outputs.version }}-windows-x64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.4"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-build.txt
      - name: Install companion and packaging dependencies
        run: python -m pip install -r requirements.txt -r requirements-build.txt
      - name: Build and smoke-check the one-file executable
        run: python build.py
      - name: Read package version
        id: version
        shell: pwsh
        run: '"version=$(python build.py --version)" >> $env:GITHUB_OUTPUT'
      - name: Verify release tag matches packaged version
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: |
          $expectedTag = "agent-v$env:PACKAGE_VERSION"
          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Release tag '$env:GITHUB_REF_NAME' does not match packaged version '$expectedTag'."
          }
      - name: Write SHA-256 sidecar
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/OverAnalyzer.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash *OverAnalyzer.exe" | Set-Content -NoNewline dist/OverAnalyzer.exe.sha256
          "SHA-256: ``$hash``" | Add-Content $env:GITHUB_STEP_SUMMARY
          "Built unsigned from ``$env:GITHUB_SHA`` with Python 3.13.4." | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Upload release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: OverAnalyzer-${{ steps.version.outputs.version }}-windows-x64
          path: |
            dist/OverAnalyzer.exe
            dist/OverAnalyzer.exe.sha256
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Create draft GitHub Release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'agent-v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      # The artifact download and release creation are kept in this one step so
      # the write-capable token is not present in the build job or its environment.
      - name: Attach build outputs to the tag release
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: ${{ needs.package.outputs.artifact-name }}
          RELEASE_VERSION: ${{ needs.package.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$ARTIFACT_NAME" \
            --dir release
          test -s release/OverAnalyzer.exe
          test -s release/OverAnalyzer.exe.sha256
          gh release create "$GITHUB_REF_NAME" \
            release/OverAnalyzer.exe \
            release/OverAnalyzer.exe.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --title "OverAnalyzer $RELEASE_VERSION" \
            --generate-notes \
            --draft \
            --verify-tag
